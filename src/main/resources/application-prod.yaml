spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql:///moodi?cloudSqlInstance=moodi-app-2026:asia-northeast3:moodi-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory&stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# 비공개 업로드 버킷 (서명 URL). 서비스 계정에 roles/iam.serviceAccountTokenCreator(signBlob)가 필요하다.
gcs:
  pick-image:
    enabled: true
  inquiry-upload:
    enabled: true
