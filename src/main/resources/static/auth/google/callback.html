<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>moodi · Google 로그인</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, "Pretendard", "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; }
    main { text-align: center; padding: 32px 24px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
    p { font-size: 14px; color: #666; margin: 0 0 20px; }
    a.btn { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #111; color: #fff;
            text-decoration: none; font-size: 15px; font-weight: 600; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">moodi 앱으로 돌아가는 중…</h1>
    <p id="desc">잠시만 기다려 주세요.</p>
    <a id="open" class="btn" href="#" hidden>앱 열기</a>
  </main>
  <script>
    // Google OAuth(response_type=id_token)가 이 페이지로 #id_token=…&state=… 를 넘긴다.
    // 값은 검사하지 않고 그대로 앱 딥링크로 전달한다 — state 검증과 id_token 검증은 앱과 백엔드가 한다.
    // 앱 스킴은 moodi-frontend app.json 의 "scheme" 과 같아야 한다.
    (function () {
      var APP_URL = "moodi://auth/google";
      var hash = window.location.hash ? window.location.hash.slice(1) : "";
      var query = window.location.search ? window.location.search.slice(1) : "";
      var payload = hash || query;
      var open = document.getElementById("open");
      var title = document.getElementById("title");
      var desc = document.getElementById("desc");

      if (!payload) {
        title.textContent = "로그인 정보를 받지 못했습니다";
        title.className = "err";
        desc.textContent = "앱에서 Google 로그인을 다시 시도해 주세요.";
        return;
      }

      var target = APP_URL + "#" + payload;
      open.href = target;
      open.hidden = false;
      // 주소창 히스토리에 토큰이 남지 않도록 replace 를 쓴다.
      try { window.location.replace(target); } catch (e) { /* 버튼으로 대체 */ }
      setTimeout(function () {
        desc.textContent = "자동으로 돌아가지 않으면 아래 버튼을 눌러 주세요.";
      }, 1500);
    })();
  </script>
</body>
</html>
