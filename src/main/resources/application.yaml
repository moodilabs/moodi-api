spring:
  application:
    name: moodi
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 1209600000

admin:
  jwt:
    access-token-expiry-ms: 1800000      # 30분
    refresh-token-expiry-ms: 43200000    # 12시간 (회원보다 짧게)
  cors:
    # 관리자 프론트 오리진(와일드카드 패턴 허용). 운영 도메인 + Vercel 프리뷰 배포 + 로컬 개발 포트.
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:https://admin.moodi.kr,https://*.vercel.app,http://localhost:5173,http://localhost:3000}
  api-log:
    # 앱 API 요청 로그 보관 일수. 지나면 매일 새벽 배치로 삭제.
    retention-days: 30
  login:
    max-failures: 5
    lock-minutes: 15
  bootstrap:
    # 둘 다 설정돼 있고 admin_account가 비어 있을 때만 기동 시 SUPER 1명을 만든다.
    login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

oauth:
  google:
    issuer: https://accounts.google.com
    audiences: ${GOOGLE_CLIENT_ID:}
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    # 탈퇴 시 계정 연결 철회용. serverAuthCode는 웹(서버) OAuth 클라이언트 앞으로 발급되므로 그 ID·secret을 쓴다.
    token:
      enabled: ${GOOGLE_TOKEN_ENABLED:false}
      client-id: ${GOOGLE_WEB_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      revoke-uri: https://oauth2.googleapis.com/revoke
      redirect-uri: ${GOOGLE_TOKEN_REDIRECT_URI:}
  apple:
    issuer: https://appleid.apple.com
    audiences: ${APPLE_CLIENT_ID:kr.moodi.app,moodi.test}
    jwks-uri: https://appleid.apple.com/auth/keys
    # 탈퇴 시 계정 연결 철회용(심사 지침 5.1.1(v)). Apple Developer > Keys > Sign in with Apple 키(.p8).
    token:
      enabled: ${APPLE_TOKEN_ENABLED:false}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
      token-uri: https://appleid.apple.com/auth/token
      revoke-uri: https://appleid.apple.com/auth/revoke

spot-import:
  enabled: false
  path: ./data/pilot/spots.csv

spot-image-migration:
  enabled: false

spot-pipeline:
  enabled: false

gcs:
  spot-image:
    enabled: false
    bucket: moodi-spot-images
  # Pick 사용자 사진. 개인 사진이라 spot-image(공개)와 버킷을 분리한다.
  # 버킷 생성과 signBlob(Service Account Token Creator) IAM이 붙기 전까지 비활성이다.
  pick-image:
    enabled: false
    bucket: moodi-pick-uploads
    upload-url-ttl-seconds: 300
    read-url-ttl-seconds: 300
  # 1:1 문의 첨부. 개인정보가 섞일 수 있어 Pick 버킷과도 분리한다. Pick과 같은 signBlob IAM 준비가 필요하다.
  inquiry-upload:
    enabled: false
    bucket: moodi-inquiry-uploads
    upload-url-ttl-seconds: 300
    read-url-ttl-seconds: 300

spot-tagging:
  enabled: false
  limit: 0

moodi:
  llm:
    api-key: ${LLM_API_KEY:}
    model: gpt-4o-mini
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  feed:
    # 스팟 카탈로그가 커서 재순환보다 재등장 방지가 목적이라 길게 잡는다.
    impression-window-days: ${FEED_IMPRESSION_WINDOW_DAYS:30}
  route:
    share:
      # 앱 딥링크 접두사. 앱은 route/shared/{publicId} 형태만 공유 루트로 인식한다.
      app-scheme: ${ROUTE_SHARE_APP_SCHEME:moodi://route/shared/}
      # 공유 링크(/s/{code}, /routes/shared/{id})의 공개 origin. 비우면 요청이 들어온 호스트를 쓴다 —
      # dev-api.moodi.kr 로 호출하면 dev 링크가, moodi.kr 로 호출하면 운영 링크가 나온다.
      base-url: ${ROUTE_SHARE_BASE_URL:}
      # 앱 미설치 시 이동할 스토어 링크. 미등록 상태면 빈 값 — 랜딩 페이지는 그대로 동작하고
      # 스토어 버튼만 숨긴다.
      # 카카오톡 미리보기 썸네일. 비워두면 컨트롤러가 요청 호스트 기준으로 static/icon_ios.jpg를
      # 채운다 — moodi.kr 같은 도메인을 여기 고정하면 그 도메인이 다른 프론트로 옮겨갔을 때
      # og:image가 조용히 깨진다.
      logo-url: ${ROUTE_SHARE_LOGO_URL:}
      ios-store-url: ${ROUTE_SHARE_IOS_STORE_URL:}
      android-store-url: ${ROUTE_SHARE_ANDROID_STORE_URL:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
